name: O-Level SAST Scan (Semgrep)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (Semgrep requires Python)
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep --config "p/ci" --metrics --timeout 120

      - name: Upload Semgrep SARIF (for GitHub Code Scanning)
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep.sarif
        # Note: semgrep can produce sarif if configured; for simplicity GitHub will show results
