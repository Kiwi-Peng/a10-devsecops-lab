name: O-Level SAST Scan (Trivy)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read       # 允許 Trivy 讀取程式碼
  security-events: write # 允許 Trivy 將結果上傳到 Security 標籤

jobs:
  trivy_secret_scan:
    name: Trivy SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'         # 掃描檔案系統
          scan-ref: '.'           # 掃描目前目錄
          scanners: 'secret'      # 僅執行密鑰掃描
          exit-code: '1'          # 如果發現問題，就讓 Action 失敗 (Red X)
          format: 'sarif'         # 輸出為 SARIF 格式 (供 GitHub 讀取)
          output: 'trivy-results.sarif' # 輸出檔案名稱
          severity: 'CRITICAL,HIGH,MEDIUM,LOW' # 僅掃描高風險和嚴重等級的密鑰

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() # 無論上一步是否失敗 (exit-code: 1)，都執行此步驟
        with:
          sarif_file: 'trivy-results.sarif' # 上傳掃描結果
